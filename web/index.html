<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SatQuery AI — Evidence-based satellite and SAR image analysis powered by Google Gemini VLM." />
    <title>Sign In — SatQuery AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/auth/auth.css" />
    <style>
      /* Video background styles */
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: relative;
        font-family: 'Outfit', system-ui, sans-serif;
      }
      .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(3, 5, 8, 0.45); /* Dark overlay to improve contrast */
        z-index: -1;
      }
      .auth-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      /* We only show the auth card, no split sides */
      .auth-right {
        background: rgba(8, 12, 22, 0.85); /* Semi-transparent background for the card area */
        backdrop-filter: blur(16px);
        padding: 40px;
        border-radius: 16px;
        border: 1px solid rgba(80, 180, 220, 0.2);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 440px;
      }
      .auth-card {
        width: 100%;
      }
      .auth-brand {
        text-align: center;
        margin-bottom: 32px;
      }
      .auth-brand h1 {
        font-family: 'Outfit', system-ui, sans-serif;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #e2e8f0;
        margin: 0 0 8px 0;
      }
      .auth-brand p {
        color: #7b8fa3;
        font-size: 1rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- Background Video -->
    <video class="video-bg" autoplay loop muted playsinline>
      <source src="/assets/cinematic_intro.mp4" type="video/mp4" />
    </video>
    <div class="overlay"></div>

    <div class="auth-container">
      <div class="auth-right">
        <div class="auth-brand">
          <h1>SatQuery AI</h1>
          <p>Evidence-Based Remote Sensing Intelligence</p>
        </div>
        
        <div class="auth-card">
          <div class="auth-header">
            <h2 class="auth-title">Welcome</h2>
            <p class="auth-subtitle">Sign in to continue to the platform</p>
          </div>
          
          <div id="alert-box" class="auth-alert"></div>

          <button id="btn-google" class="btn-google">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/auth/login.js"></script>
  </body>
</html>
