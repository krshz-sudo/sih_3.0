<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password — SatQuery AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/auth/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-left">
        <div class="auth-brand">
          <h1>SatQuery AI</h1>
          <p>Cinematic 3D Satellite Experience</p>
        </div>
      </div>
      
      <div class="auth-right">
        <div class="auth-card">
          <div class="auth-header">
            <h2 class="auth-title">Set new password</h2>
            <p class="auth-subtitle">Please enter your new password below</p>
          </div>
          
          <div id="alert-box" class="auth-alert"></div>

          <form id="reset-form" class="auth-form">
            <div class="form-group">
              <label class="form-label" for="password">New Password</label>
              <input class="form-input" type="password" id="password" placeholder="••••••••" required />
              <div class="pwd-toggle" id="toggle-pwd">Show</div>
            </div>
            
            <button type="submit" id="btn-submit" class="btn-primary">Update password</button>
          </form>

        </div>
      </div>
    </div>
    
    <script type="module" src="/src/auth/reset.js"></script>
  </body>
</html>
