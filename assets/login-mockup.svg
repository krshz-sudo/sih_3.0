<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 24, 40, 0.85)" />
      <stop offset="100%" stop-color="rgba(8, 12, 22, 0.95)" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(80, 180, 220, 0.3)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.05)" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8f9fa" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Image Placeholder (Dark Space) -->
  <rect width="1200" height="800" fill="url(#bg)" />
  
  <!-- Subtle Glows -->
  <circle cx="300" cy="200" r="250" fill="rgba(6, 182, 212, 0.08)" filter="url(#glow)" />
  <circle cx="900" cy="600" r="300" fill="rgba(34, 211, 238, 0.05)" filter="url(#glow)" />

  <!-- Center Card -->
  <g transform="translate(360, 180)" filter="url(#shadow)">
    <!-- Card Border & Fill -->
    <rect width="480" height="420" rx="20" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />
    
    <!-- Brand Texts -->
    <text x="240" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#e2e8f0" text-anchor="middle" letter-spacing="-1">SatQuery AI</text>
    <text x="240" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7b8fa3" text-anchor="middle" letter-spacing="0.5">Evidence-Based Remote Sensing Intelligence</text>
    
    <!-- Separator -->
    <line x1="60" y1="160" x2="420" y2="160" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    
    <!-- Welcome Text -->
    <text x="240" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Welcome</text>
    <text x="240" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7b8fa3" text-anchor="middle">Sign in to continue to the platform</text>
    
    <!-- Google Button -->
    <g transform="translate(60, 300)">
      <rect width="360" height="52" rx="10" fill="url(#btnBg)" />
      
      <!-- Google Logo SVG Path -->
      <g transform="translate(80, 14)">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      </g>
      
      <text x="180" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#3c4043" text-anchor="middle">Continue with Google</text>
    </g>
  </g>
</svg>
